<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scud</title><link rel="icon" href="/static/favicon.ico"><link rel="stylesheet" href="/static/app.css?v=24"></head>
<body><header><button id="mediaNav" class="brand" title="Scud media library" aria-label="Scud media library"><img src="/static/scud.svg" alt=""><span class="brandText"><b>Scud</b><small>local media for Rex</small></span></button><div class="pageHeading"><h1 id="pageTitle">Media</h1><div id="subline" class="muted"></div></div><nav><button id="settingsNav" class="gear" title="Settings" aria-label="Settings">⚙</button></nav></header>
<main><div id="compatWarning" class="compatWarning hidden" role="alert"></div><section id="setup" class="hidden"><div class="wizard"><aside><img src="/static/scud.svg"><h1>Set up Scud</h1><ol><li class="on">Rex</li><li>Libraries</li><li>Scanning</li><li>Review</li></ol></aside><div class="wizardBody"><div id="step"></div><div class="actions"><button id="back">Back</button><button id="next" class="primary">Next</button></div></div></div></section>
<section id="app" class="hidden"><div class="toprow"><div class="statusArea"><div id="scanProgress" class="statusPanel" role="status"></div></div><div><button id="rescan">↻ Rescan</button><button id="snapshot">Full Rex sync</button></div></div><div class="filterGroups"><div><span class="filterLabel">Media type</span><div id="typeChips" class="chips" role="group" aria-label="Media type"></div></div><div><span class="filterLabel">Match state</span><div id="stateChips" class="chips" role="group" aria-label="Match state"></div></div></div><div class="toolbar"><input id="search" placeholder="Search filename, title, or ID…"><input id="kind" type="hidden" value=""><input id="status" type="hidden" value=""></div><div class="tablewrap"><table class="mediaTable" aria-label="Media library"><thead><tr><th>Type</th><th>Folder / File</th><th>Matched title</th><th>ID</th><th>Match</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section id="settings" class="hidden"><div class="toprow"><div></div><button id="closeSettings">← Media</button></div><div id="settingsForm"></div><button id="saveSettings" class="primary">Save settings</button></section></main>
<dialog id="matchDialog"><form method="dialog"><button class="x">×</button><h2 id="matchDialogTitle">Match media</h2><div class="matchPreview"><img id="matchPoster" class="hidden" alt="Selected title poster"><p id="matchFile" class="muted"></p></div><p id="matchScope" class="muted"></p><div id="episodePicker" class="hidden"><h3>Episode <button type="button" class="settingHelp" data-setting-help="episode_numbering" aria-label="Help: Episode selection" aria-haspopup="dialog">?</button></h3><div class="formgrid"><label>Season<select id="episodeSeason"></select></label><label>Episode<select id="episodeNumber"></select></label></div><label>Last episode in this file (for multi-episode files)<select id="episodeEnd"></select></label><p id="episodePickerStatus" class="muted" role="status"></p></div><details id="matchFiles"><summary>Files</summary><input id="filterMatchFiles" aria-label="Filter filenames" placeholder="Find a filename"><ul id="matchFilenames"></ul></details><div id="matchParsed" class="muted"></div><div class="matchSearch"><input id="matchQuery" aria-label="Search title" placeholder="Search for a movie or show"><button id="searchMatches" type="button">Search</button></div><p id="matchSearchStatus" class="muted" role="status"></p><div id="matchSuggestions"></div><label>ID <button type="button" class="settingHelp" data-setting-help="media_id" aria-label="Help: Media ID" aria-haspopup="dialog" title="Help: Media ID">?</button><input id="manualId" placeholder="tt0084787 or tmdb://1091"></label><label>Title (optional)<input id="manualTitle"></label><label>Year (optional)<input id="manualYear" type="number"></label><div class="actions"><button value="cancel">Cancel</button><button id="applyMatch" value="default" class="primary">Apply match</button></div></form></dialog>
<dialog id="settingHelpDialog" aria-labelledby="settingHelpTitle"><form method="dialog"><button class="x" aria-label="Close help">×</button><h2 id="settingHelpTitle"></h2><div id="settingHelpBody"></div><div class="actions"><button class="primary">Got it</button></div></form></dialog>
<div id="toast"></div><script src="/static/media-tree.js?v=24"></script><script src="/static/app.js?v=24"></script></body></html>
